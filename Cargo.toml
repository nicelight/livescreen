[package]
name = "livescreen"
version = "0.1.0"
edition = "2024"
description = "Screen, camera and audio recorder for Ubuntu"
license = "MIT"

[dependencies]
anyhow = "1.0"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "global_shortcuts", "gtk4"] }
cairo-rs = "0.22"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6.0"
futures-util = "0.3"
gdk4-x11 = "0.11.4"
glib = "0.22"
gstreamer = { version = "0.25.3", features = ["v1_28"] }
gstreamer-app = "0.25.2"
gtk4 = { version = "0.11.4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x11rb = "0.13.2"
zbus = "5.18"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
